spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartmail}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# Frontend URL used after a successful Google sign-in. Set SMARTMAIL_FRONTEND_URL
# to https://smart-mail-wheat.vercel.app on Render; local defaults to Vite.
app.frontend-url=${SMARTMAIL_FRONTEND_URL:http://localhost:5173}
