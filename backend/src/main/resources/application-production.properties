# The Vercel frontend and Render backend are on different sites. The browser
# must send the backend session cookie on credentialed API requests.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Render terminates TLS at its proxy. Honor forwarded headers so Spring
# generates HTTPS OAuth callback URLs and secure redirects.
server.forward-headers-strategy=framework

# Keep a safe deployed default if the Render variable has not been added yet.
app.frontend-url=${SMARTMAIL_FRONTEND_URL:https://smart-mail-wheat.vercel.app}
